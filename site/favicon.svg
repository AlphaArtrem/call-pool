<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="CALLPOOL">
  <!--
    The mark: an open ring with the drop sitting in its mouth. It reads as the
    C of CALLPOOL and as the pool with one call landing in it, which is the
    whole mechanic in two shapes.

    Drawn as a stroked arc rather than a letter, because a <text> element in a
    favicon depends on whatever font the renderer happens to have and a
    monogram that falls back to a serif is worse than no monogram. Paths render
    identically everywhere.

    ⚠️ The colours are presentation ATTRIBUTES, and the <style> block below only
    overrides them. That order matters and is not a style preference: a favicon
    is rasterised in image mode, and some renderers ignore an SVG's internal
    stylesheet entirely. With CSS-only fills those renderers fall back to the
    SVG default — solid black — which on a dark browser tab is invisible and
    looks exactly like a missing favicon. Attributes first means the worst case
    is "the light-mode tint did not apply", not "the icon disappeared".

    No background plate. A near-black chip disappears into a dark tab strip and
    a white one glares in it; the accent green carries against both, which is
    why the site uses it as the one accent in the first place.

    Sized for 16px: stroke is 17% of the viewBox and the ring is 80% of it, so
    the opening survives being drawn into a dozen pixels. Check any edit at
    actual size — a mark that is legible at 32 and mud at 16 is a mark that
    nobody ever sees working.

    favicon.ico is a raster mirror of this file for browsers that will not take
    an SVG icon. If this mark changes, that file is stale until it is redrawn:
    ring centred (16,16) r=10, stroke 5.5, open between -55° and +55°; drop
    centred (25.6,16) r=3.4; colour #22c55e on transparent.
  -->
  <style>
    @media (prefers-color-scheme: light) {
      .ring { stroke: #15803d; }
      .drop { fill: #15803d; }
    }
  </style>

  <path
    class="ring"
    d="M21.74 7.81 A10 10 0 1 0 21.74 24.19"
    fill="none"
    stroke="#22c55e"
    stroke-width="5.5"
    stroke-linecap="round"
  />
  <circle class="drop" cx="25.6" cy="16" r="3.4" fill="#22c55e" />
</svg>

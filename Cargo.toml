[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

# overflow-checks is not optional here. The program does lamport arithmetic on
# `outstanding` and `claimed_lamports`, and a silent wraparound in a program
# with no upgrade authority is unfixable.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

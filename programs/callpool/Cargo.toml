[package]
name = "callpool"
version = "0.1.0"
description = "CALLPOOL — merkle-gated SOL distribution for pump.fun creator fees"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "callpool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
# Used only to *read* token accounts and to close the pool's own wSOL ATA.
# The program is never a mint or freeze authority and never holds a delegate.
anchor-spl = "1.1.2"
# sha256 for the merkle tree. anchor-lang 1.x no longer re-exports a hash
# module, so the hasher is taken directly rather than through a shim.
solana-sha256-hasher = "3.1.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.0.0"
# Reads the shared merkle vectors that pin this verifier to the JS builder (D6).
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
